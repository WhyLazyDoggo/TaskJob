<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Checklist</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">TaskJob Workspace</p>
        <h1>Daily Checklist</h1>
      </div>
      <div class="header-actions">
        <span id="save-state" class="save-state">Đang tải dữ liệu</span>
        <button id="theme-toggle" class="icon-button" type="button" title="Đổi giao diện" aria-label="Đổi giao diện">☾</button>
      </div>
    </header>

    <section class="summary-grid" aria-label="Thống kê task">
      <article class="metric-card metric-total">
        <span>Tổng task</span>
        <strong id="st-total">0</strong>
      </article>
      <article class="metric-card metric-todo">
        <span>Chưa làm</span>
        <strong id="st-todo">0</strong>
      </article>
      <article class="metric-card metric-checking">
        <span>Đang kiểm</span>
        <strong id="st-checking">0</strong>
      </article>
      <article class="metric-card metric-done">
        <span>Hoàn tất</span>
        <strong id="st-done">0</strong>
      </article>
    </section>

    <section class="task-studio">
      <form id="task-form" class="task-form" autocomplete="off">
        <label class="field field-title" for="task-title">
          <span>Task</span>
          <input id="task-title" type="text" placeholder="Nhập task mới" maxlength="255">
        </label>
        <label class="field" for="task-priority">
          <span>Ưu tiên</span>
          <select id="task-priority">
            <option value="Low">Thấp</option>
            <option value="Medium">Trung bình</option>
            <option value="High">Cao</option>
          </select>
        </label>
        <label class="field" for="task-deadline">
          <span>Deadline</span>
          <input id="task-deadline" type="date">
        </label>
        <button class="primary-button" type="submit">
          <span aria-hidden="true">+</span>
          <span>Thêm</span>
        </button>
      </form>

      <div class="progress-block" aria-label="Tiến độ hoàn tất">
        <div class="progress-text">
          <span>Tiến độ</span>
          <strong id="progress-label">0%</strong>
        </div>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>
    </section>

    <section class="tool-strip" aria-label="Công cụ task">
      <label class="search-field" for="task-search">
        <span>Tìm kiếm</span>
        <input id="task-search" type="search" placeholder="Tìm task hoặc mã">
      </label>

      <div class="filters" role="group" aria-label="Lọc trạng thái">
        <button class="filter-button is-active" type="button" data-filter="all">Tất cả</button>
        <button class="filter-button" type="button" data-filter="todo">Chưa làm</button>
        <button class="filter-button" type="button" data-filter="checking">Đang kiểm</button>
        <button class="filter-button" type="button" data-filter="done">Hoàn tất</button>
      </div>

      <div class="data-actions">
        <label class="ghost-button" for="import-file">
          <span>Nhập data</span>
          <input id="import-file" type="file" accept=".txt,.json,application/json">
        </label>
        <button id="export-data" class="ghost-button" type="button">Xuất data</button>
        <button id="download-data" class="dark-button" type="button">Tải data.txt</button>
      </div>
    </section>

    <section class="task-list">
      <div class="list-header">
        <h2>Danh sách task</h2>
        <span id="data-source" class="data-source"></span>
      </div>
      <div class="table-shell">
        <table>
          <thead>
            <tr>
              <th class="drag-column"></th>
              <th>Tasks</th>
              <th>Code</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="task-table">
            <tr>
              <td class="empty-row" colspan="6">Đang tải dữ liệu...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section id="export-panel" class="export-panel" hidden>
      <div class="export-header">
        <h2>Nội dung data.txt</h2>
        <button id="close-export" class="icon-button" type="button" title="Đóng" aria-label="Đóng">×</button>
      </div>
      <textarea id="export-output" readonly spellcheck="false"></textarea>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
